name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-dev.yml
      - centaur_sdk/**
      - contrib/chart/**
      - packages/**
      - services/**
      - tools/**
      - workflows/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: "471112601787"
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 471112601787.dkr.ecr.eu-central-1.amazonaws.com
  EKS_CLUSTER_NAME: eu-central-1-dev
  HELM_RELEASE: centaur
  HELM_NAMESPACE: centaur
  AWS_ROLE_ARN: arn:aws:iam::471112601787:role/oidc/github-deploy

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: centaur-api
            dockerfile: services/api/Dockerfile
            target: ""
          - image: centaur-agent
            dockerfile: services/sandbox/Dockerfile
            target: sandbox
          - image: centaur-iron-proxy
            dockerfile: services/iron-proxy/Dockerfile
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Helm deploy
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --alias "$EKS_CLUSTER_NAME"

      - name: Build chart dependencies
        run: helm dependency build contrib/chart

      - name: Deploy chart
        run: |
          helm upgrade --install "$HELM_RELEASE" contrib/chart \
            --namespace "$HELM_NAMESPACE" \
            --values contrib/chart/values.aws-dev.yaml \
            --set "api.image.repository=$ECR_REGISTRY/centaur-api" \
            --set "api.image.tag=$GITHUB_SHA" \
            --set "sandbox.image.repository=$ECR_REGISTRY/centaur-agent" \
            --set "sandbox.image.tag=$GITHUB_SHA" \
            --set "ironProxy.image.repository=$ECR_REGISTRY/centaur-iron-proxy" \
            --set "ironProxy.image.tag=$GITHUB_SHA" \
            --wait \
            --timeout 10m
