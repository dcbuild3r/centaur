apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "laminar.componentName" (dict "root" . "component" "postgres") }}
  labels:
{{ include "laminar.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "laminar.componentName" (dict "root" . "component" "postgres") }}
  replicas: 1
  selector:
    matchLabels:
{{ include "laminar.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "laminar.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ include "laminar.image" .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "laminar.secretName" . }}
                  key: {{ .Values.auth.keys.postgresPassword }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "laminar.componentName" (dict "root" . "component" "postgres") }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "laminar.componentName" (dict "root" . "component" "clickhouse") }}
  labels:
{{ include "laminar.componentLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
spec:
  serviceName: {{ include "laminar.componentName" (dict "root" . "component" "clickhouse") }}
  replicas: 1
  selector:
    matchLabels:
{{ include "laminar.componentSelectorLabels" (dict "root" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "laminar.componentSelectorLabels" (dict "root" . "component" "clickhouse") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-data-permissions
          image: {{ include "laminar.image" .Values.images.clickhouse | quote }}
          imagePullPolicy: {{ .Values.images.clickhouse.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - chown -R 101:101 /var/lib/clickhouse
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
              drop: [ALL]
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      containers:
        - name: clickhouse
          image: {{ include "laminar.image" .Values.images.clickhouse | quote }}
          imagePullPolicy: {{ .Values.images.clickhouse.pullPolicy }}
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "laminar.secretName" . }}
                  key: {{ .Values.auth.keys.clickhouseUser }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "laminar.secretName" . }}
                  key: {{ .Values.auth.keys.clickhousePassword }}
            - name: CLICKHOUSE_DB
              value: default
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
{{ toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: config
              mountPath: /etc/clickhouse-server/users.d/lmnr.xml
              subPath: profiles.xml
            - name: config
              mountPath: /etc/clickhouse-server/config.d/lmnr.xml
              subPath: server.xml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "laminar.componentName" (dict "root" . "component" "clickhouse") }}
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "laminar.componentName" (dict "root" . "component" "clickhouse") }}
---
