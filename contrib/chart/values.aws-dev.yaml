secretManager:
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  enabled: true
  # This persistent database was initialized with the tempo role. Keep using
  # that role so application migrations run as the owner of existing objects.
  auth:
    username: tempo
  persistence:
    storageClassName: ebs-auto
    subPath: pgdata

apiRs:
  databaseUsernameOverride: tempo
  opVault: Centaur
  sandboxReadyTimeoutSecs: 240
  sandboxWarmPoolSize: 3
  # Keep long-running Codex progress in Slack's single assistant status instead
  # of publishing one structured task card per internal tool invocation.
  activitySummary:
    enabled: true
  meetingScheduler:
    enabled: true
    organizerCalendars: '{"orbie":"orbie-automation@world.org"}'
    manualOrganizerCalendarKey: orbie
    zoomHostUserId: orbie-automation@world.org
  extraEnv:
    MEETING_OPS_SCHEDULER_ENABLED: "true"
    MEETING_OPS_SCHEDULER_CRON: "*/15 * * * *"
    MEETING_PRIVATE_NOTION_DATABASES_JSON: '{"U03TNH0DUQP":"4f5f1e63445a8351ab61819daf8842e0"}'
    MEETING_PRIVATE_NOTION_SHARED_DATABASES_JSON: '{}'
    MEETING_PRIVATE_NOTION_USER_IDS_JSON: '{"U03TNH0DUQP":"abe238b6-01b4-440b-9661-3c3eb324c119"}'
    SESSION_SANDBOX_PASSTHROUGH_ENV: "MEETING_OPS_SCHEDULER_ENABLED,MEETING_OPS_SCHEDULER_CRON,MEETING_PRIVATE_NOTION_DATABASES_JSON,MEETING_PRIVATE_NOTION_SHARED_DATABASES_JSON,MEETING_PRIVATE_NOTION_USER_IDS_JSON"

# The Foundation fork is private, while this environment does not provision a
# long-lived GitHub token for repo-cache. Use the immutable tool trees baked
# into the api-rs and sandbox images built from the same deployment commit.
toolServer:
  enabled: false

repoCache:
  enabled: false

sandbox:
  image:
    pullPolicy: IfNotPresent
  extraEnv:
    TOOL_DIRS: /opt/centaur/tools
    CODEX_MODEL: gpt-5.6-luna
    CODEX_MODEL_REASONING_EFFORT: xhigh

ironProxy:
  # Keep the production harness credential on the AWS-backed Kubernetes
  # Secret. Explicit op:// references, such as the Notion tool's page-scoped
  # reference, continue to resolve through the Centaur vault.
  secretSource: env
  secretSourceRefs:
    GITHUB_TOKEN: op://Centaur/oged7xfyssmixegfj3kf3piymm/credential
    GITHUB_TOKEN_WORLDFND: op://Centaur/wlsn2v5vzsr4bikftn45mfbily/credential
    NOTION_API_KEY: op://Centaur/Centaur.run - NOTION_API_KEY/password
    NOTION_PRIVATE_MEETINGS_API_KEY: op://Centaur/NOTION_PRIVATE_MEETINGS_API_KEY/NOTION_PRIVATE_MEETINGS_API_KEY
    DUNE_API_KEY: op://Centaur/DUNE_API_KEY/credential
    GOOGLE_TOKEN_JSON: op://Centaur/GOOGLE_TOKEN_JSON/credential
    MEETING_OPS_SCRIPT_ID: op://Centaur/MEETING_OPS_SCRIPT_ID/credential

secrets:
  bootstrapSecretName: centaur-onepassword-bootstrap

tokenBroker:
  enabled: false

console:
  enabled: true
  publicUrl: https://centaur-dev.theworldnetwork.org
  adminSlackThreadsEnabled: true
  ssoEmailDomains:
    - world.org
  bootstrapAdmins:
    - orbie-automation@world.org
  googleOauth:
    enabled: true

slackbotv2:
  enabled: true
  # Allow World Foundation members to request deletion of Orbie-authored
  # messages with the configured wastebasket reaction.
  deleteAllowedTeamIds: "TL1HM8UUU"
  # The shared DATABASE_URL still names the newer role, while the persistent
  # Chat SDK state tables are owned by the legacy tempo role.
  databaseUsernameOverride: tempo

ingress:
  enabled: true
  className: centaur
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/target-type: ip
  host: centaur-dev.theworldnetwork.org
githubbot:
  enabled: true
  userName: wf-orbie
  autoMerge: false
  databaseUsernameOverride: tempo
networkPolicy:
  enabled: false
