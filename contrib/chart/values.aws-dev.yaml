secretManager:
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  enabled: true
  persistence:
    storageClassName: ebs-auto
    subPath: pgdata

apiRs:
  sandboxReadyTimeoutSecs: 240
  sandboxWarmPoolSize: 1

sandbox:
  image:
    pullPolicy: IfNotPresent

ironProxy:
  secretSource: env

tokenBroker:
  enabled: false

slackbotv2:
  enabled: true

ingress:
  enabled: true
  className: centaur
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/target-type: ip
  host: centaur-dev.theworldnetwork.org
networkPolicy:
  enabled: false
