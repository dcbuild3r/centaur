secretManager:
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  enabled: true
  persistence:
    storageClassName: ebs-auto
    subPath: pgdata

migrations:
  enabled: false

api:
  executionWorkerEnabled: true
  workflowWorkerEnabled: true
  warmPoolEnabled: true
  pluginWatcherEnabled: false
  egressDiscovery:
    enabled: false
  extraEnv:
    KUBERNETES_SANDBOX_READY_TIMEOUT_S: "240"
    WARM_POOL_BACKEND_TIMEOUT: "240"
    WARM_POOL_SIZE: "1"

sandbox:
  image:
    pullPolicy: IfNotPresent

ironProxy:
  secretSource: env

tokenBroker:
  enabled: false

slackbot:
  enabled: true

ingress:
  enabled: true
  className: centaur
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/target-type: ip
  host: centaur-dev.theworldnetwork.org
  service:
    component: slackbot
    port: 3001

networkPolicy:
  enabled: false
