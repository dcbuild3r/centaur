secretManager:
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  enabled: true
  # This persistent database was initialized with the tempo role. Keep using
  # that role so application migrations run as the owner of existing objects.
  auth:
    username: tempo
  persistence:
    storageClassName: ebs-auto
    subPath: pgdata

apiRs:
  databaseUsernameOverride: tempo
  opVault: Centaur
  sandboxReadyTimeoutSecs: 240
  sandboxWarmPoolSize: 1

sandbox:
  image:
    pullPolicy: IfNotPresent

ironProxy:
  secretSource: onepassword

secrets:
  bootstrapSecretName: centaur-onepassword-bootstrap

tokenBroker:
  enabled: false

console:
  enabled: true

slackbotv2:
  enabled: true
  # The shared DATABASE_URL still names the newer role, while the persistent
  # Chat SDK state tables are owned by the legacy tempo role.
  databaseUsernameOverride: tempo

ingress:
  enabled: true
  className: centaur
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/target-type: ip
  host: centaur-dev.theworldnetwork.org
networkPolicy:
  enabled: false
