[project]
name = "meeting-ops"
description = "Run the Google Apps Script worker for meeting cadences"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "httplib2>=0.20.0",
    "pysocks>=1.7.1",
    "typer>=0.12.0",
]

[project.scripts]
meeting-ops = "centaur_tool_meeting_ops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_meeting_ops"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
hosts = ["script.googleapis.com"]
secrets = [
    { type = "oauth_token", grant = "refresh_token", name = "GOOGLE_TOKEN_JSON", token_endpoint = "https://oauth2.googleapis.com/token", hosts = ["script.googleapis.com"], fields = { refresh_token = { secret_ref = "GOOGLE_TOKEN_JSON", json_key = "refresh_token" }, client_id = { secret_ref = "GOOGLE_TOKEN_JSON", json_key = "client_id" }, client_secret = { secret_ref = "GOOGLE_TOKEN_JSON", json_key = "client_secret" } } },
    { type = "http", name = "MEETING_OPS_SCRIPT_ID", match_path = true, hosts = ["script.googleapis.com"] },
]
