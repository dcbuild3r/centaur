[project]
name = "notion-private-meetings"
description = "Purpose-bound Notion writer for private Orbie meeting notes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "typer>=0.12.0"]

[project.scripts]
notion-private-meetings = "centaur_tool_notion_private_meetings.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_notion_private_meetings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = ["api.notion.com"]
secrets = [
    {type = "http", name = "NOTION_PRIVATE_MEETINGS_API_KEY", mode = "replace", match_headers = ["Authorization"], hosts = ["api.notion.com"]},
]
